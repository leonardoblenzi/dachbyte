name: dachbyte-staging
x-runtime: &runtime
  restart: unless-stopped
  init: true
  networks: [edge, data]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  caddy:
    <<: *runtime
    image: caddy:2-alpine
    networks: [edge]
    ports: ["${DACHBYTE_BIND_IP:-127.0.0.1}:80:80", "${DACHBYTE_BIND_IP:-127.0.0.1}:443:443"]
    environment:
      DACHBYTE_SITE: "${DACHBYTE_SITE:-http://localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
  gateway:
    <<: *runtime
    build: {context: "..", dockerfile: infra/docker/node.Dockerfile, target: seller}
    image: dachbyte/seller:local
    command: ["node", "apps/gateway/server.js"]
    env_file: ["./env/gateway.env", "./env/hub.env"]
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "/app/scripts/vps-healthcheck.cjs", "/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
  seller-ml-web:
    <<: *runtime
    build: {context: "..", dockerfile: infra/docker/node.Dockerfile, target: seller}
    image: dachbyte/seller:local
    command: ["node", "apps/seller-ml/start.js"]
    env_file: ["./env/seller-ml.env", "./env/hub.env"]
    volumes: ["ml_results:/app/apps/seller-ml/results"]
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "/app/scripts/vps-healthcheck.cjs", "/ml/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
  seller-ml-worker:
    <<: *runtime
    build: {context: "..", dockerfile: infra/docker/node.Dockerfile, target: seller}
    image: dachbyte/seller:local
    command: ["node", "apps/seller-ml/worker.js"]
    env_file: ["./env/seller-ml.env", "./env/hub.env"]
    volumes: ["ml_results:/app/apps/seller-ml/results"]
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "/app/scripts/vps-worker-health.cjs"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
  seller-magalu-web:
    <<: *runtime
    build: {context: "..", dockerfile: infra/docker/node.Dockerfile, target: seller}
    image: dachbyte/seller:local
    command: ["node", "apps/seller-magalu/start.js"]
    env_file: ["./env/seller-magalu.env", "./env/hub.env"]
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "/app/scripts/vps-healthcheck.cjs", "/magalu/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
  seller-magalu-worker:
    <<: *runtime
    build: {context: "..", dockerfile: infra/docker/node.Dockerfile, target: seller}
    image: dachbyte/seller:local
    command: ["node", "apps/seller-magalu/src/worker.js"]
    env_file: ["./env/seller-magalu.env", "./env/hub.env"]
    environment:
      NODE_ENV: production
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "/app/apps/seller-magalu/scripts/worker-health.cjs"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
  seller-magalu-migrate:
    profiles: [ops]
    build: {context: "..", dockerfile: infra/docker/node.Dockerfile, target: seller}
    image: dachbyte/seller:local
    command: ["node", "apps/seller-magalu/db/migrate.js", "deploy"]
    env_file: ["./env/seller-magalu.env"]
    environment:
      NODE_ENV: production
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  seller-shopee:
    <<: *runtime
    build: {context: "..", dockerfile: infra/docker/node.Dockerfile, target: seller}
    image: dachbyte/seller:local
    command: ["node", "apps/seller-shopee/start.js"]
    env_file: ["./env/seller-shopee.env", "./env/hub.env"]
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "/app/scripts/vps-healthcheck.cjs", "/shopee/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
  seller-madeira:
    <<: *runtime
    build: {context: "..", dockerfile: infra/docker/node.Dockerfile, target: seller}
    image: dachbyte/seller:local
    command: ["node", "apps/seller-madeira/start.js"]
    env_file: ["./env/seller-madeira.env", "./env/hub.env"]
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "/app/scripts/vps-healthcheck.cjs", "/madeiramadeira/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
  seller-tracking:
    <<: *runtime
    build: {context: "..", dockerfile: infra/docker/node.Dockerfile, target: seller}
    image: dachbyte/seller:local
    command: ["node", "apps/seller-tracking/start.js"]
    env_file: ["./env/seller-tracking.env", "./env/hub.env"]
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "/app/scripts/vps-healthcheck.cjs", "/avantracking/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
  seller-log:
    <<: *runtime
    build: {context: "..", dockerfile: infra/docker/node.Dockerfile, target: seller}
    image: dachbyte/seller:local
    command: ["node", "apps/seller-log/start.js"]
    env_file: ["./env/seller-log.env", "./env/hub.env"]
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "/app/scripts/vps-healthcheck.cjs", "/davanttilog/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
  seller-leader:
    <<: *runtime
    build: {context: "..", dockerfile: infra/docker/node.Dockerfile, target: seller}
    image: dachbyte/seller:local
    command: ["node", "apps/seller-leader/start.js"]
    env_file: ["./env/seller-leader.env", "./env/hub.env"]
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "/app/scripts/vps-healthcheck.cjs", "/skuleader/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
  ads-api:
    <<: *runtime
    build: {context: "..", dockerfile: infra/docker/node.Dockerfile, target: ads}
    image: dachbyte/ads:local
    command: ["node", "apps/ads/start.js"]
    env_file: ["./env/ads.env", "./env/ads-google.env", "./env/hub.env"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      ADS_AUTH_MODE: hub
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "/app/scripts/vps-healthcheck.cjs", "/ads/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  ads-worker:
    <<: *runtime
    build: {context: "..", dockerfile: infra/docker/node.Dockerfile, target: ads}
    image: dachbyte/ads:local
    command: ["node", "apps/ads/worker.js"]
    env_file: ["./env/ads.env", "./env/ads-google.env", "./env/hub.env"]
    environment:
      NODE_ENV: production
      ADS_AUTH_MODE: hub
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "/app/apps/ads/scripts/worker-health.cjs"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  ads-migrate:
    profiles: [ops]
    build: {context: "..", dockerfile: infra/docker/node.Dockerfile, target: ads}
    image: dachbyte/ads:local
    command: ["node", "apps/ads/infrastructure/db/migrate.js"]
    env_file: ["./env/ads-migrate.env"]
    environment:
      NODE_ENV: production
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  business-portal:
    <<: *runtime
    build: {context: "..", dockerfile: infra/docker/node.Dockerfile, target: business}
    image: dachbyte/business:local
    command: ["node", "apps/business/product-server.cjs"]
    env_file: ["./env/business-portal.env", "./env/hub.env"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      DACHBYTE_PRODUCT: portal
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "/app/scripts/vps-healthcheck.cjs", "/business/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
  business-core:
    <<: *runtime
    build:
      context: ".."
      dockerfile: infra/docker/node.Dockerfile
      target: core
      args:
        VOLT_CORE_PUBLIC_BASE_PATH: /business/core
        VOLT_CORE_API_BASE_PATH: /business/core/api
    image: dachbyte/core:local
    command: ["node", "apps/business/product-server.cjs"]
    env_file: ["./env/business-core.env", "./env/hub.env"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      DACHBYTE_PRODUCT: core
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "/app/scripts/vps-healthcheck.cjs", "/business/core/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
  business-stock:
    <<: *runtime
    build:
      context: ".."
      dockerfile: infra/docker/node.Dockerfile
      target: stock
      args:
        VOLT_STOCK_PUBLIC_BASE_PATH: /business/stock
        VOLT_STOCK_PUBLIC_API_URL: /business/stock/api
    image: dachbyte/stock:local
    command: ["node", "apps/business/product-server.cjs"]
    env_file: ["./env/business-stock.env", "./env/hub.env"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      DACHBYTE_PRODUCT: stock
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "/app/scripts/vps-healthcheck.cjs", "/business/stock/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
  business-chat:
    <<: *runtime
    build:
      context: ".."
      dockerfile: infra/docker/node.Dockerfile
      target: chat
      args:
        VOLT_CHAT_PUBLIC_PATH: /business/chat
        VOLT_CHAT_PUBLIC_API_URL: /business/chat/api
    image: dachbyte/chat:local
    command: ["node", "apps/business/product-server.cjs"]
    env_file: ["./env/business-chat.env", "./env/hub.env"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      DACHBYTE_PRODUCT: chat
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "/app/scripts/vps-healthcheck.cjs", "/business/chat/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
  business-price:
    <<: *runtime
    build: {context: "..", dockerfile: infra/docker/node.Dockerfile, target: business}
    image: dachbyte/business:local
    command: ["node", "apps/business/product-server.cjs"]
    env_file: ["./env/business-price.env", "./env/hub.env"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      DACHBYTE_PRODUCT: price
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "/app/scripts/vps-healthcheck.cjs", "/business/price/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
  business-chat-api:
    <<: *runtime
    build: {context: "..", dockerfile: infra/docker/chat-api.Dockerfile}
    image: dachbyte/chat-api:local
    env_file: ["./env/business-chat-api.env", "./env/hub.env"]
    volumes: ["chat_uploads:/data/uploads"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
  business-chat-migrate:
    profiles: [ops]
    build: {context: "..", dockerfile: infra/docker/chat-api.Dockerfile}
    image: dachbyte/chat-api:local
    command: ["python", "scripts/deploy_db.py"]
    env_file: ["./env/business-chat-api.env"]
    environment:
      ENVIRONMENT: production
      AUTO_MIGRATE_DB: "false"
      AUTO_SEED_USERS: "false"
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  business-core-migrate:
    profiles: [ops]
    build:
      context: ".."
      dockerfile: infra/docker/node.Dockerfile
      target: core
      args:
        VOLT_CORE_PUBLIC_BASE_PATH: /business/core
        VOLT_CORE_API_BASE_PATH: /business/core/api
    image: dachbyte/core:local
    command: ["npm", "--prefix", "apps/business/core", "run", "migrate"]
    env_file: ["./env/business-core.env", "./env/business-core-migrate.env"]
    environment:
      NODE_ENV: production
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  business-stock-migrate:
    profiles: [ops]
    build:
      context: ".."
      dockerfile: infra/docker/node.Dockerfile
      target: stock
      args:
        VOLT_STOCK_PUBLIC_BASE_PATH: /business/stock
        VOLT_STOCK_PUBLIC_API_URL: /business/stock/api
    image: dachbyte/stock:local
    command: ["npm", "--prefix", "apps/business/stock", "run", "db:migrate"]
    env_file: ["./env/business-stock.env", "./env/business-stock-migrate.env"]
    environment:
      NODE_ENV: production
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  business-price-migrate:
    profiles: [ops]
    build: {context: "..", dockerfile: infra/docker/node.Dockerfile, target: business}
    image: dachbyte/business:local
    command: ["node", "apps/business/price/db/migrate.js"]
    env_file: ["./env/business-price.env", "./env/business-price-migrate.env"]
    environment:
      NODE_ENV: production
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"


  hub-web:
    <<: *runtime
    build:
      context: "${HUB_CHECKOUT_DIR:-/opt/dachbyte/hub-pagamento}"
      dockerfile: Dockerfile
    image: dachbyte/hub:local
    command: ["npm", "run", "start:web"]
    env_file: ["./env/hub-runtime.env"]
    environment:
      NODE_ENV: production
      PORT: "8787"
    networks: [edge, data]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  hub-scheduler:
    profiles: [hub-scheduler]
    <<: *runtime
    build:
      context: "${HUB_CHECKOUT_DIR:-/opt/dachbyte/hub-pagamento}"
      dockerfile: Dockerfile
    image: dachbyte/hub:local
    command: ["npm", "run", "start:scheduler"]
    env_file: ["./env/hub-runtime.env"]
    environment:
      NODE_ENV: production
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}

  hub-migrate:
    profiles: [ops]
    build:
      context: "${HUB_CHECKOUT_DIR:-/opt/dachbyte/hub-pagamento}"
      dockerfile: Dockerfile
    image: dachbyte/hub:local
    command: ["npm", "run", "db:migrate"]
    env_file: ["./env/hub-migrate.env"]
    environment:
      NODE_ENV: production
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"


  hub-rehearsal-db:
    profiles: [rehearsal]
    image: postgres:18-bookworm
    env_file: ["./env/postgres.env", "./env/hub-rehearsal-db.env"]
    entrypoint: ["/bin/bash", "/usr/local/bin/database-rehearsal"]
    networks: [edge, data]
    volumes:
      - ./hub-rehearsal/database-rehearsal.sh:/usr/local/bin/database-rehearsal:ro
      - ./backups/hub-rehearsal:/backups
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  hub-rehearsal-migrate:
    profiles: [rehearsal]
    build:
      context: "${HUB_CHECKOUT_DIR:-/opt/dachbyte/hub-pagamento}"
      dockerfile: Dockerfile
    image: dachbyte/hub:local
    command: ["npm", "run", "db:migrate"]
    env_file: ["./env/hub-rehearsal-migrate.env"]
    environment:
      NODE_ENV: production
    networks: [data]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  hub-rehearsal-compare:
    profiles: [rehearsal]
    build:
      context: "${HUB_CHECKOUT_DIR:-/opt/dachbyte/hub-pagamento}"
      dockerfile: Dockerfile
    image: dachbyte/hub:local
    command: ["node", "scripts/rehearsal/compare-databases.mjs"]
    env_file: ["./env/hub-rehearsal-compare.env"]
    networks: [edge, data]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  hub-rehearsal-web:
    profiles: [rehearsal]
    build:
      context: "${HUB_CHECKOUT_DIR:-/opt/dachbyte/hub-pagamento}"
      dockerfile: Dockerfile
    image: dachbyte/hub:local
    command: ["npm", "run", "start:web"]
    env_file: ["./env/hub-rehearsal-runtime.env"]
    environment:
      NODE_ENV: production
      PORT: "8787"
    networks: [edge, data]
    ports: ["127.0.0.1:${HUB_REHEARSAL_BIND_PORT:-18787}:8787"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: "no"


  hub-cutover-db:
    profiles: [cutover]
    image: postgres:18-bookworm
    env_file: ["./env/postgres.env", "./env/hub-cutover.env"]
    entrypoint: ["/bin/bash", "/usr/local/bin/database-cutover"]
    networks: [edge, data]
    volumes:
      - ./hub-cutover/database-cutover.sh:/usr/local/bin/database-cutover:ro
      - ./backups/hub-cutover:/backups
      - ./.cutover:/cutover-state
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  hub-cutover-compare:
    profiles: [cutover]
    build:
      context: "${HUB_CHECKOUT_DIR:-/opt/dachbyte/hub-pagamento}"
      dockerfile: Dockerfile
    image: dachbyte/hub:local
    command: ["node", "scripts/rehearsal/compare-databases.mjs"]
    env_file: ["./env/hub-runtime.env", "./env/hub-cutover.env"]
    networks: [edge, data]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  hub-cutover-tools:
    profiles: [cutover]
    build:
      context: "${HUB_CHECKOUT_DIR:-/opt/dachbyte/hub-pagamento}"
      dockerfile: Dockerfile
    image: dachbyte/hub:local
    command: ["npm", "run", "cutover:smoke"]
    env_file: ["./env/hub-runtime.env", "./env/hub-cutover.env"]
    networks: [edge, data]
    volumes:
      - ./.cutover:/cutover-state:ro
    restart: "no"

  postgres-provision:
    profiles: [ops]
    image: postgres:18-bookworm
    env_file: ["./env/postgres.env"]
    entrypoint: ["/bin/bash", "/usr/local/bin/provision-business"]
    networks: [data]
    volumes:
      - ./postgres/provision-business.sh:/usr/local/bin/provision-business:ro
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  postgres:
    <<: *runtime
    image: postgres:18-bookworm
    networks: [data]
    env_file: ["./env/postgres.env"]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/provision-business.sh:/docker-entrypoint-initdb.d/20-business-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    <<: *runtime
    image: redis:7-alpine
    networks: [data]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  edge: {}
  data:
    internal: true
volumes:
  postgres_data: {}
  redis_data: {}
  caddy_data: {}
  caddy_config: {}
  chat_uploads: {}
  ml_results: {}
