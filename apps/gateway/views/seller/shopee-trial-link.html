<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vincular loja Shopee · DACHBYTE</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;background:#090d17;color:#eef4ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,520px);padding:32px;border:1px solid #293b55;border-radius:22px;background:#111c2d;box-shadow:0 25px 70px #0007}
    small{color:#ff9a4b;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font-size:1.7rem;margin:12px 0}
    p{line-height:1.55;color:#b6c7df}button{margin-top:16px;padding:15px 22px;background:#ff8b39;border:0;border-radius:10px;color:#09121d;font-weight:800;cursor:pointer;width:100%}
    button:disabled{opacity:.55;cursor:wait}a{color:#8eb8ff}#message{min-height:1.4em}
  </style>
</head>
<body><main>
  <small>Shopee · conta existente</small>
  <h1>Vincular loja à sua empresa</h1>
  <p>A loja autorizada será associada à empresa <strong id="company">que você selecionou no login</strong>. O período de teste da Shopee pertence à empresa e não recomeça ao vincular outra loja.</p>
  <button type="button" id="confirm" disabled>Concluir vínculo</button>
  <p id="message" role="status" aria-live="polite"></p>
  <p><a href="/selecao-plataforma">Voltar à Seleção de plataforma</a></p>
</main><script>
  const button = document.getElementById('confirm');
  const message = document.getElementById('message');
  fetch('/api/portal/overview', { credentials: 'same-origin', cache: 'no-store' })
    .then(async (response) => response.ok ? response.json() : null)
    .then((overview) => {
      if (!overview?.ok || !overview.tenant?.name || overview.user?.can_manage_billing !== true) {
        throw new Error('Não foi possível confirmar sua empresa. Entre novamente com um administrador.');
      }
      document.getElementById('company').textContent = overview.tenant.name;
      button.disabled = false;
    })
    .catch((error) => { message.textContent = error.message; });
  button.addEventListener('click', async () => {
    button.disabled = true;
    message.textContent = 'Confirmando empresa e loja…';
    try {
      const response = await fetch('/api/portal/trial/shopee/claim', {
        method: 'POST', credentials: 'same-origin', headers: {'content-type':'application/json'}, body:'{}',
      });
      const result = await response.json();
      if (!response.ok || result.ok !== true) throw new Error(result.error || 'Não foi possível concluir o vínculo.');
      message.textContent = 'Loja vinculada. Abrindo a Seleção de plataforma…';
      location.assign('/selecao-plataforma');
    } catch (error) {
      message.textContent = error.message;
      button.disabled = false;
    }
  });
</script></body></html>
