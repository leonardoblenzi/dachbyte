<!doctype html>
<html lang="pt-BR" data-dachbyte-line="seller" data-dachbyte-app="seller-shopee">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/shopee/" />
    <link rel="icon" type="image/svg+xml" href="img/dachbyte-seller-mark.svg?v=1" />
    <link rel="apple-touch-icon" href="img/dachbyte-seller-mark.svg?v=1" />
    <title>Redefinir Senha Shopee</title>
    <link rel="stylesheet" href="login.css" />
  <link rel="stylesheet" href="/brand/dachbyte/theme.css?v=20260904" />
  </head>
  <body>
    <a href="/shopee/login" class="back-btn">
      <span>&larr;</span>
      <span>Voltar</span>
    </a>

    <main class="auth-stage">
      <div class="auth-shell">
        <section class="auth-panel">
          <div class="auth-kicker">
            <span class="auth-kicker__dot"></span>
            <span>Nova senha</span>
          </div>

          <h1 class="auth-title">Redefinir senha</h1>
          <p class="auth-subtitle">
            Defina uma nova senha para acessar seu workspace Shopee.
          </p>

          <div id="login-msg" class="login-msg"></div>
          <div id="reset-meta" class="auth-bodycopy" style="display:none;"></div>

          <form id="reset-form" class="form" autocomplete="on">
            <label class="auth-field">
              <span class="auth-field__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="5" y="11" width="14" height="9" rx="2"></rect>
                  <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                </svg>
              </span>
              <input id="password" type="password" placeholder="Nova senha" class="auth-field__input" autocomplete="new-password" required />
            </label>

            <label class="auth-field">
              <span class="auth-field__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9 12l2 2 4-4"></path>
                  <rect x="5" y="11" width="14" height="9" rx="2"></rect>
                  <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                </svg>
              </span>
              <input id="confirm-password" type="password" placeholder="Confirmar senha" class="auth-field__input" autocomplete="new-password" required />
            </label>

            <div class="auth-actions">
              <button class="btn" id="btn-reset" type="submit">Salvar nova senha</button>
            </div>
          </form>
        </section>

        <aside class="auth-visual">
          <div class="auth-visual__card">
            <span class="auth-visual__badge">Protecao do acesso</span>
            <h2 class="auth-visual__title">Token temporario, uso unico e trilha de seguranca</h2>
            <p class="auth-visual__text">
              O reset fica registrado em auditoria e o link expira rapido para reduzir risco operacional.
            </p>
            <div class="auth-visual__pulse"></div>
          </div>
        </aside>
      </div>
    </main>

    <script defer src="reset-password.js"></script>
  </body>
</html>
