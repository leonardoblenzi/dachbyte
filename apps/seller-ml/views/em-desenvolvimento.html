<!doctype html>
<html lang="pt-BR" data-dachbyte-line="seller" data-dachbyte-app="seller-ml">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Em desenvolvimento | DACHBYTE Mercado Livre</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        overflow: hidden;
        background: #050509;
        font-family: "Inter", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        color: white;
        perspective: 1400px;
      }

      .bg-parallax {
        position: absolute;
        inset: 0;
        opacity: 0.22;
        background-size: 160%;
      }

      .layer1 {
        z-index: 1;
        background: radial-gradient(circle, #00eaff33, transparent 70%);
        animation: move1 18s ease-in-out infinite alternate;
      }
      .layer2 {
        z-index: 2;
        background: radial-gradient(circle, #ff00ff33, transparent 70%);
        animation: move2 22s ease-in-out infinite alternate;
      }
      .layer3 {
        z-index: 3;
        background: radial-gradient(circle, #00ff8833, transparent 70%);
        animation: move3 26s ease-in-out infinite alternate;
      }

      @keyframes move1 {
        0% {
          transform: translate(-30px, -20px);
        }
        100% {
          transform: translate(30px, 20px);
        }
      }
      @keyframes move2 {
        0% {
          transform: translate(20px, 10px);
        }
        100% {
          transform: translate(-20px, -10px);
        }
      }
      @keyframes move3 {
        0% {
          transform: translate(-15px, 30px);
        }
        100% {
          transform: translate(15px, -30px);
        }
      }

      .container {
        position: relative;
        z-index: 20;
        text-align: center;
        padding: 2rem;
        animation: entry3D 1.8s cubic-bezier(0.13, 0.77, 0.38, 1.02);
      }

      @keyframes entry3D {
        0% {
          transform: translateY(40px) rotateX(35deg) scale(0.85);
          filter: blur(20px);
          opacity: 0;
        }
        60% {
          transform: translateY(-8px) rotateX(8deg) scale(1.05);
          filter: blur(6px);
          opacity: 1;
        }
        100% {
          transform: translateY(0) rotateX(0) scale(1);
          filter: blur(0);
          opacity: 1;
        }
      }

      .title {
        font-size: 3.5rem;
        font-weight: 800;
        letter-spacing: 6px;
        margin-bottom: 1rem;
        background: linear-gradient(135deg, #00eaff, #ff00ff, #00ff88);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .message {
        font-size: 1.8rem;
        margin-bottom: 2rem;
        color: rgba(255, 255, 255, 0.8);
      }

      .description {
        font-size: 1.1rem;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 3rem;
        max-width: 500px;
        margin-left: auto;
        margin-right: auto;
      }

      .btn-back {
        display: inline-block;
        padding: 1rem 2.4rem;
        background: rgba(0, 234, 255, 0.1);
        border: 1px solid rgba(0, 234, 255, 0.3);
        backdrop-filter: blur(14px);
        border-radius: 14px;
        cursor: pointer;
        font-size: 1.1rem;
        transition: 0.25s ease;
        color: #00eaff;
        text-decoration: none;
        box-shadow: 0 0 22px #00eaff55;
      }

      .btn-back:hover {
        transform: translateY(-6px) scale(1.07);
        backdrop-filter: blur(24px);
        background: rgba(0, 234, 255, 0.2);
      }

      .construction {
        font-size: 4rem;
        margin-bottom: 1.5rem;
        animation: bounce 2s infinite;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }
    </style>
  <link rel="stylesheet" href="/brand/dachbyte/theme.css?v=20260904" />
  </head>

  <body>
    <!-- CAMADAS DE FUNDO -->
    <div class="bg-parallax layer1"></div>
    <div class="bg-parallax layer2"></div>
    <div class="bg-parallax layer3"></div>

    <!-- CONTEUDO -->
    <div class="container">
      <div class="construction">Em breve</div>
      <h1 class="title">MadeiraMadeira</h1>
      <p class="message">Em Desenvolvimento</p>
      <p class="description">
        Esta integracao esta sendo desenvolvida e em breve estara disponivel.
        Obrigado pela paciencia!
      </p>
      <a href="/selecao-plataforma" class="btn-back"><- Voltar para Selecao</a>
    </div>
  </body>
</html>
