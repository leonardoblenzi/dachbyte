<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090b10">
  <title>Confirmar e-mail · DACHBYTE Shopee</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; background: #090b10; color: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 10%, #172b39, #090b10 66%); }
    main { width: min(100%, 480px); background: #111824; border: 1px solid #324354; border-radius: 18px; padding: clamp(24px, 5vw, 36px); box-shadow: 0 24px 70px #0008; }
    .eyebrow { color: #ee8c59; font-size: 12px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    h1 { font-size: clamp(28px, 6vw, 36px); line-height: 1.08; margin: 12px 0; }
    p { color: #b6c4d4; line-height: 1.55; }
    label { display: block; margin: 28px 0 8px; font-size: 13px; font-weight: 700; }
    input { width: 100%; padding: 14px; border: 1px solid #49647e; border-radius: 9px; background: #0b111b; color: #fff; font: inherit; }
    button { width: 100%; margin-top: 14px; padding: 14px; border: 0; border-radius: 9px; background: #ee4d2d; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    a { color: #ffac86; }
    :focus-visible { outline: 3px solid #8cd0ff; outline-offset: 3px; }
    #message { min-height: 2em; margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">DACHBYTE Seller · Shopee</div>
    <h1>Confirme seu e-mail</h1>
    <p>A loja foi autorizada na Shopee. Informe seu e-mail para continuar. O teste de 7 dias só começa após a ativação.</p>
    <form id="email-form">
      <label for="email">Seu e-mail</label>
      <input id="email" type="email" autocomplete="email" required maxlength="254">
      <button type="submit">Continuar</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script>
    const form = document.getElementById('email-form');
    const message = document.getElementById('message');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = form.querySelector('button');
      button.disabled = true;
      message.textContent = 'Verificando e-mail…';
      try {
        const response = await fetch('/shopee/auth/trial/email', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Não foi possível continuar. Tente novamente.');
        if (result.action === 'login_required') {
          message.replaceChildren(document.createTextNode('Este e-mail já possui acesso. '));
          const link = document.createElement('a');
          link.href = '/login?trial=shopee';
          link.textContent = 'Entre na sua conta para vincular a loja.';
          message.append(link);
        } else {
          message.textContent = 'Enviamos um link de confirmação. Confira seu e-mail para continuar.';
        }
      } catch (error) {
        message.textContent = error.message;
      } finally { button.disabled = false; }
    });
  </script>
</body>
</html>
